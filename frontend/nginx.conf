server {
  listen 80;
  root /usr/share/nginx/html;

  # Un QR con su imagen del centro puede ocupar un par de megas.
  client_max_body_size 4m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # Rutas de Angular (/nuevo, /qr/…): todas sirven index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
